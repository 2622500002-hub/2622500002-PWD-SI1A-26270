<html>

<body>
<fieldset>
    <legend>Data Pribadi</legend>
<form action="" method="GET">
    Nama : <input type="text" name="nama">
    Password : <input type="password" name="password">
    Jenis Kelamin : <input type="radio" name="jenis_kelamin" value="Laki-laki" checked>Laki-laki
                    <input type="radio" name="jenis_kelamin" value="Perempuan">Perempuan

    Program studi :

        <option value="si" selected> Sistem Informasi</option>
        <option value="ti">Teknik Informatika</option>
        <option value="bd">Bisnis Digital</option>
    </select>
    Hobi :  <input type="checkbox" name="hobi_baca">Membaca
            <input type="checkbox" name="hobi_traveling">Traveling
            <input type="checkbox" name="hobi_masak">Memasak
    Alamat : <textarea name="alamat"></textarea>
    <input type="submit" name="submit" value="kirim"
</form>
</fieldset>
</body>
</html>
